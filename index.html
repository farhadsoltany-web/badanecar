<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بدنه کار</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;900&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Vazirmatn', Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f1f5f9;
      color: #1e293b;
    }

    .custom-banner {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 60%, #334155 100%);
      color: #ffffff;
      border-radius: 16px;
      padding: 25px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.3);
      margin-bottom: 25px;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .banner-content {
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .banner-logo {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 14px;
      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .banner-text h1 {
      margin: 0 0 6px 0;
      font-size: 24px;
      font-weight: 900;
      color: #f8fafc;
    }

    .banner-text .sub-title {
      margin: 0;
      font-size: 13px;
      color: #94a3b8;
      font-weight: 500;
      letter-spacing: 1px;
    }

    .banner-badge {
      display: inline-block;
      background: #f59e0b;
      color: #0f172a;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 6px;
      margin-right: 8px;
    }

    .banner-bg-icon {
      position: absolute;
      left: -20px;
      bottom: -30px;
      opacity: 0.06;
      pointer-events: none;
    }

    .instruction-text {
      font-size: 15px;
      font-weight: 600;
      color: #d97706;
      text-align: center;
      margin-bottom: 20px;
    }

    .selection-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }

    .row-label {
      font-size: 15px;
      font-weight: 600;
      color: #475569;
      min-width: 110px;
      text-align: left;
    }

    .tab-container {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tab-btn {
      padding: 9px 18px;
      font-size: 14px;
      font-family: 'Vazirmatn', Arial, sans-serif;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      color: #334155;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 600;
    }

    .tab-btn:hover {
      background: #e2e8f0;
    }

    .tab-btn.main-active {
      background: #2563eb;
      color: white;
      border-color: #2563eb;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
    }

    .tab-btn.sub-active {
      background: #0284c7;
      color: white;
      border-color: #0284c7;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.25);
    }

    .table-container {
      overflow-x: auto;
      background: white;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      margin-top: 20px;
      border: 1px solid #e2e8f0;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      white-space: nowrap;
    }

    th, td {
      border: 1px solid #e2e8f0;
      padding: 12px 16px;
      text-align: right;
      font-size: 14px;
    }

    th {
      background: #f8fafc;
      color: #334155;
      font-weight: 700;
    }

    tr:nth-child(even) {
      background-color: #f8fafc;
    }

    tr:hover {
      background-color: #f1f5f9;
    }
  </style>
</head>
<body>

  <div class="custom-banner">
    <div class="banner-content">
      <div class="banner-logo">
        <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.5 2.8C2.1 11.2 2 11.6 2 12v4c0 .6.4 1 1 1h2"/>
          <circle cx="7" cy="17" r="2"/>
          <path d="M9 17h6"/>
          <circle cx="17" cy="17" r="2"/>
        </svg>
      </div>
      <div class="banner-text">
        <h1>بدنه کار <span class="banner-badge">همدان</span></h1>
        <p class="sub-title">SOLTANI AUTO BODY PARTS • HAMEDAN</p>
      </div>
    </div>
    
    <div class="banner-bg-icon">
      <svg width="180" height="180" viewBox="0 0 24 24" fill="white">
        <path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.5 2.8C2.1 11.2 2 11.6 2 12v4c0 .6.4 1 1 1h2"/>
      </svg>
    </div>
  </div>

  <div class="instruction-text">لطفاً ابتدا خودروی خود را انتخاب کنید:</div>

  <div class="selection-row">
    <span class="row-label">شرکت سازنده:</span>
    <div id="mainTabContainer" class="tab-container">
      <span style="color: #888;">در حال دریافت اطلاعات...</span>
    </div>
  </div>

  <div class="selection-row" id="subSectionRow" style="display: none;">
    <span class="row-label">مدل خودرو:</span>
    <div id="subTabContainer" class="tab-container"></div>
  </div>

  <div class="table-container">
    <table id="dataTable">
      <tbody>
        <tr><td style="text-align: center; color: #888;">لطفاً گزینه‌های بالا را انتخاب کنید.</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzRkZivSpRwG3MYWKNtG6t1BfIoNV6Qo643aTYFz3yShs7LCsBtI8w4Eil9bpdjXdhgJQ/exec";
    let globalData = {};

    fetch(API_URL)
      .then(res => res.json())
      .then(data => {
        globalData = data;
        renderMainTabs();
      })
      .catch(err => {
        document.getElementById("mainTabContainer").innerHTML = "<span style='color:red;'>خطا در اتصال به داده‌ها</span>";
      });

    function renderMainTabs() {
      const container = document.getElementById("mainTabContainer");
      container.innerHTML = "";

      const mainCategories = Object.keys(globalData);
      
      if (mainCategories.length === 0) {
        container.innerHTML = "<span style='color: red;'>هیچ داده‌ای یافت نشد.</span>";
        return;
      }

      mainCategories.forEach(cat => {
        const btn = document.createElement("button");
        btn.className = "tab-btn";
        btn.textContent = cat;
        
        btn.onclick = function() {
          document.querySelectorAll('#mainTabContainer .tab-btn').forEach(b => b.classList.remove('main-active'));
          btn.classList.add('main-active');
          renderSubTabs(cat);
        };

        container.appendChild(btn);
      });

      if (container.children.length > 0) {
        container.children[0].click();
      }
    }

    function renderSubTabs(mainCat) {
      const subSectionRow = document.getElementById("subSectionRow");
      const subContainer = document.getElementById("subTabContainer");
      subContainer.innerHTML = "";

      const subCategories = Object.keys(globalData[mainCat] || {});

      if (subCategories.length === 0) {
        subSectionRow.style.display = "none";
        renderTable([]);
        return;
      }

      subSectionRow.style.display = "flex";

      subCategories.forEach(subCat => {
        const btn = document.createElement("button");
        btn.className = "tab-btn";
        btn.textContent = subCat;
        
        btn.onclick = function() {
          document.querySelectorAll('#subTabContainer .tab-btn').forEach(b => b.classList.remove('sub-active'));
          btn.classList.add('sub-active');
          renderTable(globalData[mainCat][subCat]);
        };

        subContainer.appendChild(btn);
      });

      if (subContainer.children.length > 0) {
        subContainer.children[0].click();
      }
    }

    function renderTable(rows) {
      const table = document.getElementById("dataTable");
      table.innerHTML = "";

      if (!rows || rows.length === 0) {
        table.innerHTML = "<tr><td style='text-align: center; color: #888;'>داده‌ای موجود نیست.</td></tr>";
        return;
      }

      rows.forEach((row, rowIndex) => {
        const tr = document.createElement("tr");
        row.forEach(cell => {
          const element = document.createElement(rowIndex === 0 ? "th" : "td");
          element.textContent = cell;
          tr.appendChild(element);
        });
        table.appendChild(tr);
      });
    }
  </script>

</body>
</html>
